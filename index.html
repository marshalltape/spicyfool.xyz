    <title>Elite Digital Directory | Swiss Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
            --bg-base: #050010;
            --bg-card: #0a0a0c;
            --color-text-main: #ffffff;
            --color-text-muted: #8a8a93;
            --color-divider: #1f1f25;
            --badge-primary: #3221ff;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.5);
            --shadow-hard: 0 30px 60px rgba(0, 0, 0, 0.8);
            --shadow-hover: 0 40px 100px rgba(0, 0, 0, 0.95);
            --transition-smooth: 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            --transition-fast: 0.2s ease-out;
            --max-width: 1040px;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; scroll-behavior: smooth; }
        body {
            font-family: var(--font-main);
            color: var(--color-text-main);
            background-color: var(--bg-base);
            min-height: 100vh; overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            cursor: auto;
            position: relative;
        }
        ::selection { background: var(--badge-primary); color: #ffffff; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a4a5d; }
        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #050014, #1a0033, #3c096c, #1900ff, #0055ff, #050014);
            background-size: 400% 400%;
            animation: cinematicPan 12s ease-in-out infinite alternate;
            z-index: 1;
        }
        @keyframes cinematicPan {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none; opacity: 0.35;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }
        #particleCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 3; pointer-events: none; opacity: 0.5;
        }
        #glow {
            position: fixed; top: 0; left: 0;
            width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 40%, rgba(255,255,255,0) 70%);
            border-radius: 50%; pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9998; mix-blend-mode: screen;
            opacity: 0;
            transition: opacity 0.3s ease, width var(--transition-fast), height var(--transition-fast);
            will-change: left, top, width, height, opacity;
        }
        #glow.moving { opacity: 1; }
        #glow.active {
            width: 650px; height: 650px;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 40%, rgba(255,255,255,0) 70%);
        }
        .content-layer {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; padding: 80px 20px 120px 20px;
            position: relative; z-index: 10;
        }
        .container { width: 100%; max-width: var(--max-width); margin: 0 auto; }
        .header {
            width: 100%; margin-bottom: 70px;
            display: flex; flex-direction: column; align-items: center;
            animation: fadeDown 1s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header-title {
            font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 900;
            letter-spacing: -0.05em; margin-bottom: 35px;
            color: #ffffff; text-transform: uppercase;
            text-shadow: var(--shadow-soft); text-align: center; line-height: 1;
        }
        .search-wrapper { width: 100%; max-width: 640px; position: relative; }
        .search-input {
            width: 100%; padding: 24px 24px 24px 64px;
            font-family: var(--font-main); font-size: 1.25rem; font-weight: 500;
            color: #ffffff; background: rgba(10, 10, 12, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px;
            outline: none; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            transition: all var(--transition-smooth); box-shadow: var(--shadow-hard);
        }
        .search-input::placeholder { color: rgba(255,255,255,0.4); font-weight: 400; }
        .search-input:focus {
            border-color: rgba(255,255,255,0.5);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 0 4px rgba(255,255,255,0.05);
            background: rgba(10, 10, 12, 0.95); transform: translateY(-2px);
        }
        .search-icon {
            position: absolute; left: 28px; top: 50%; transform: translateY(-50%);
            width: 24px; height: 24px; stroke: rgba(255,255,255,0.5);
            pointer-events: none; transition: stroke var(--transition-fast); stroke-width: 2.5;
        }
        .search-input:focus ~ .search-icon { stroke: #ffffff; }
        .search-meta {
            margin-top: 16px; font-size: 0.85rem; font-weight: 600;
            color: rgba(255,255,255,0.6); text-align: center;
            opacity: 0; transition: opacity var(--transition-fast);
            letter-spacing: 0.5px; text-transform: uppercase;
        }
        .search-meta.visible { opacity: 1; }
        .catalog-grid {
            display: flex; flex-direction: column; gap: 40px;
            width: 100%; perspective: 2500px;
        }
        .card-perspective-wrapper {
            transform-style: preserve-3d;
            animation: slideUpFade 0.7s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
            opacity: 0; cursor: pointer;
        }
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(50px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .swiss-card {
            background-color: var(--bg-card); width: 100%; border-radius: 36px;
            padding: 50px 60px; color: var(--color-text-main);
            box-shadow: var(--shadow-hard);
            transition: transform var(--transition-smooth), box-shadow var(--transition-smooth), border var(--transition-smooth);
            position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.06);
        }
        .card-perspective-wrapper:hover .swiss-card {
            box-shadow: var(--shadow-hover); border-color: rgba(255,255,255,0.2);
        }
        .card-top { text-align: center; margin-bottom: 25px; position: relative; }
        .title-group { display: inline-block; position: relative; }
        .card-huge-title {
            font-size: clamp(50px, 12vw, 150px); font-weight: 900;
            letter-spacing: -0.06em; line-height: 0.85; margin: 0;
            text-transform: uppercase; color: #ffffff;
            font-feature-settings: "salt", "ss01";
        }
        .card-badge {
            position: absolute; top: -15px; right: -45px;
            width: 54px; height: 54px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 12px; font-weight: 800; letter-spacing: 0.5px;
            color: #ffffff; text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            transition: transform var(--transition-smooth);
            border: 2px solid rgba(255,255,255,0.1);
        }
        .card-perspective-wrapper:hover .card-badge { transform: scale(1.15) rotate(10deg); }
        .card-divider { height: 1px; background-color: var(--color-divider); width: 100%; margin: 20px 0; }
        .card-specs {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; flex-wrap: wrap; gap: 15px;
        }
        .spec-pill {
            font-size: 11px; color: var(--color-text-muted); font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px;
            background: rgba(255,255,255,0.03); padding: 6px 12px; border-radius: 12px;
        }
        .card-bottom { display: flex; justify-content: space-between; align-items: center; padding-top: 15px; }
        .action-group { display: flex; align-items: center; gap: 18px; }
        .price-circle {
            background-color: #ffffff; color: #000000;
            width: 50px; height: 50px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-weight: 900; font-size: 18px; transition: all var(--transition-smooth);
        }
        .card-perspective-wrapper:hover .price-circle {
            background-color: var(--badge-primary); color: #ffffff;
            box-shadow: 0 10px 25px rgba(50, 33, 255, 0.5); transform: scale(1.05);
        }
        .action-label { font-weight: 700; font-size: 16px; color: #ffffff; text-transform: uppercase; letter-spacing: 0.5px; }
        .brand-group { text-align: right; }
        .brand-name { display: block; font-weight: 800; font-size: 15px; color: #ffffff; }
        .brand-sub {
            display: block; font-size: 9px; color: var(--color-text-muted);
            margin-top: 4px; letter-spacing: 1.5px; text-transform: uppercase;
        }
        .empty-view {
            text-align: center; padding: 100px 20px; background: rgba(10,10,12,0.6);
            border: 1px dashed rgba(255,255,255,0.15); border-radius: 36px;
            display: none; backdrop-filter: blur(15px);
        }
        .empty-view h2 { font-size: 2.5rem; font-weight: 800; margin-bottom: 15px; letter-spacing: -0.02em; }
        .empty-view p { color: var(--color-text-muted); font-size: 1.1rem; }
        @media (max-width: 768px) {
            .content-layer { padding: 40px 15px 80px 15px; }
            .swiss-card { padding: 40px 25px; border-radius: 28px; }
            .card-huge-title { font-size: 16vw; }
            .card-badge { width: 42px; height: 42px; font-size: 10px; right: -15px; top: -10px; }
            .card-specs { flex-direction: column; align-items: flex-start; gap: 8px; }
            .spec-pill { background: transparent; padding: 0; }
            .action-label { display: none; }
            .header-title { font-size: 2.5rem; }
        }

            { t: "Express", b: "VPN", c: "#ff1e56", s: ["Ultra Fast", "Streaming Opt", "Private Key", "No-Logs"], p: 25, sub: "SECURITY DEPT", k: ["vpn", "express", "fast"] },
            { t: "Telegram", b: "DE", c: "#00d4ff", s: ["German Number", "Clean IP Reg", "No Limits", "Secure"], p: 9, sub: "CATALOG #4", k: ["telegram", "de", "germany"] }
        ];
        const masterDatabase = [];
        let globalId = 1;
        for(let loop = 1; loop <= 15; loop++) {
            assetTemplates.forEach((template) => {
                masterDatabase.push({
                    id: `asset_uuid_${globalId}`,
                    hugeTitle: template.t,
                    badgeText: template.b,
                    badgeColor: template.c,
                    specs: template.s,
                    price: template.p,
                    actionText: 'Acquire',
                    brand: 'Premium Digital',
                    subBrand: template.sub + ` • BATCH ${loop}`,
                    keywords: template.k
                });
                globalId++;
            });
        }
        class CursorEngine {
            constructor() {
                this.glow = document.getElementById('glow');
                this.mouseX = window.innerWidth / 2;
                this.mouseY = window.innerHeight / 2;
                this.glowX = window.innerWidth / 2;
                this.glowY = window.innerHeight / 2;
                this.moveTimeout = null;
                this.initListeners();
                this.runRenderLoop();
            }
            initListeners() {
                const handleMove = (x, y) => {
                    this.mouseX = x;
                    this.mouseY = y;
                    this.glow.classList.add('moving');
                    clearTimeout(this.moveTimeout);
                    this.moveTimeout = setTimeout(() => {
                        this.glow.classList.remove('moving');
                    }, 300);
                };
                window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
                window.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
                const triggerActive = () => this.glow.classList.add('active');
                const triggerIdle = () => this.glow.classList.remove('active');
                window.addEventListener('mousedown', triggerActive);
                window.addEventListener('mouseup', triggerIdle);
                window.addEventListener('touchstart', triggerActive, { passive: true });
                window.addEventListener('touchend', triggerIdle);
            }
            runRenderLoop() {
                this.glowX += (this.mouseX - this.glowX) * 0.15;
                this.glowY += (this.mouseY - this.glowY) * 0.15;
                this.glow.style.transform = `translate3d(calc(${this.glowX}px - 50%), calc(${this.glowY}px - 50%), 0)`;
                requestAnimationFrame(() => this.runRenderLoop());
            }
        }
        new CursorEngine();
        const isHoverCapable = window.matchMedia("(pointer: fine)").matches;
        function attachTiltPhysics(cardWrapper) {
            if(!isHoverCapable) return;
            const card = cardWrapper.querySelector('.swiss-card');
            cardWrapper.addEventListener('mousemove', (e) => {
                const rect = cardWrapper.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -3;
                const rotateY = ((x - centerX) / centerX) * 3;
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
            });
            cardWrapper.addEventListener('mouseleave', () => {
                card.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            });
        }
        class CatalogEngine {
            constructor(database) {
                this.db = database;
                this.grid = document.getElementById('resultsGrid');
                this.searchInput = document.getElementById('searchInput');
                this.stats = document.getElementById('searchStats');
                this.emptyState = document.getElementById('emptyState');
                this.renderBatch();
                this.bindSearch();
            }
            renderBatch() {
                this.clear();
                const batch = this.db.slice(0, 30);
                batch.forEach((product, index) => this.buildCardNode(product, index));
                this.stats.textContent = `Displaying ${batch.length} Elite Assets`;
                this.stats.classList.add('visible');
            }
            bindSearch() {
                this.searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase().trim();
                    this.executeSearch(query);
                });
            }
            executeSearch(query) {
                this.clear();
                if (query.length === 0) {
                    this.renderBatch();
                    return;
                }
                const matched = this.db.filter(item => {
                    const matchTitle = item.hugeTitle.toLowerCase().includes(query);
                    const matchBadge = item.badgeText.toLowerCase().includes(query);
                    const matchKeywords = item.keywords.some(kw => kw.includes(query) || query.includes(kw));
                    return matchTitle || matchBadge || matchKeywords;
                });
                this.stats.textContent = `${matched.length} Assets Found`;
                this.stats.classList.add('visible');
                if (matched.length > 0) {
                    this.emptyState.style.display = 'none';
                    matched.slice(0, 50).forEach((product, index) => this.buildCardNode(product, index));
                } else {
                    this.emptyState.style.display = 'block';
                }
            }
            clear() {
                const existingCards = this.grid.querySelectorAll('.card-perspective-wrapper');
                existingCards.forEach(card => card.remove());
            }
            buildCardNode(product, index) {
                const wrapper = document.createElement('div');
                wrapper.className = 'card-perspective-wrapper';
                wrapper.style.animationDelay = `${index * 0.05}s`;
                wrapper.addEventListener('click', () => {
                    alert(`SYSTEM: Initiating secure protocol for [${product.hugeTitle} ${product.badgeText}]`);
                });
                const specsHTML = product.specs.map(spec => `<span class="spec-pill">${spec}</span>`).join('');
                wrapper.innerHTML = `
                    <div class="swiss-card">
                        <div class="card-top">
                            <div class="title-group">
                                <h2 class="card-huge-title">${product.hugeTitle}</h2>
                                <div class="card-badge" style="background-color: ${product.badgeColor};">${product.badgeText}</div>
                            </div>
                        </div>
                        <div class="card-divider"></div>
                        <div class="card-specs">${specsHTML}</div>
                        <div class="card-divider"></div>
                        <div class="card-bottom">
                            <div class="action-group">
                                <div class="price-circle">$${product.price}</div>
                                <span class="action-label">${product.actionText}</span>
                            </div>
                            <div class="brand-group">
                                <span class="brand-name">${product.brand}</span>
                                <span class="brand-sub">${product.subBrand}</span>
                            </div>
                        </div>
                    </div>
                `;
                this.grid.appendChild(wrapper);
                attachTiltPhysics(wrapper);
            }
        }
        new CatalogEngine(masterDatabase);
        class CinematicDust {
            constructor() {
                this.canvas = document.getElementById('particleCanvas');
                this.ctx = this.canvas.getContext('2d', { alpha: true });
                this.particles = [];
                this.count = 80;
                this.setup();
                this.loop();
                window.addEventListener('resize', () => this.setup());
            }
            setup() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.particles = [];
                for (let i = 0; i < this.count; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        size: Math.random() * 1.5 + 0.5,
                        speedX: (Math.random() - 0.5) * 0.4,
                        speedY: (Math.random() - 0.5) * 0.4,
                        opacity: Math.random() * 0.4 + 0.1
                    });
                }
            }
            loop() {
                requestAnimationFrame(() => this.loop());
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                for (let i = 0; i < this.particles.length; i++) {
                    let p = this.particles[i];
                    p.x += p.speedX; p.y += p.speedY;
                    if (p.x > this.canvas.width) p.x = 0;
                    else if (p.x < 0) p.x = this.canvas.width;
                    if (p.y > this.canvas.height) p.y = 0;
                    else if (p.y < 0) p.y = this.canvas.height;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                    this.ctx.fill();
                }
            }
        }
        new CinematicDust();
    </script>
