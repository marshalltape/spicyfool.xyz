<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Digital Store | Elite Accounts</title>
    
    <!-- Подключение премиальных шрифтов от Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. CSS VARIABLES (DESIGN TOKENS)
           ========================================================================== */
        :root {
            /* Typography */
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
            
            /* Colors */
            --color-white: #ffffff;
            --color-black: #000000;
            --color-accent: #00d4ff;
            --color-accent-hover: #00b3cc;
            
            /* Glassmorphism Backgrounds */
            --glass-bg-light: rgba(255, 255, 255, 0.05);
            --glass-bg-medium: rgba(255, 255, 255, 0.1);
            --glass-bg-heavy: rgba(255, 255, 255, 0.15);
            
            /* Borders */
            --border-light: rgba(255, 255, 255, 0.1);
            --border-medium: rgba(255, 255, 255, 0.2);
            --border-accent: rgba(0, 212, 255, 0.6);
            
            /* Shadows */
            --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 15px 40px rgba(0, 0, 0, 0.3);
            --shadow-accent: 0 5px 25px rgba(0, 212, 255, 0.4);
            
            /* Transitions */
            --trans-fast: 0.2s ease;
            --trans-normal: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --trans-slow: 0.5s ease-in-out;
            
            /* Layout */
            --container-width: 1200px;
            --border-radius-sm: 12px;
            --border-radius-md: 24px;
            --border-radius-lg: 40px;
        }

        /* ==========================================================================
           2. RESET & NORMALIZE
           ========================================================================== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            color: var(--color-white);
            background: #0a0a0a; /* Fallback */
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Selection */
        ::selection {
            background: var(--color-accent);
            color: var(--color-black);
        }

        /* ==========================================================================
           3. BACKGROUND & CANVAS LAYER
           ========================================================================== */
        /* Animated Gradient Background */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(-45deg, #a1002b, #1100aa, #6600a1, #0088aa);
            background-size: 400% 400%;
            animation: gradientCloud 12s ease-in-out infinite;
            z-index: -2;
        }

        @keyframes gradientCloud {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Canvas for Particles */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.6;
        }

        /* ==========================================================================
           4. CURSOR GLOW (REFINED)
           ========================================================================== */
        #glow {
            position: fixed;
            top: 0;
            left: 0;
            /* Уменьшенный базовый размер */
            width: 200px; 
            height: 200px;
            /* Более мягкое и прозрачное свечение */
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            mix-blend-mode: screen;
            transition: transform 0.05s linear, 
                        width var(--trans-normal), 
                        height var(--trans-normal), 
                        background var(--trans-fast);
        }

        /* Эффект при клике (аккуратный) */
        #glow.active {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0) 70%);
        }

        /* ==========================================================================
           5. LAYOUT COMPONENTS
           ========================================================================== */
        .page-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            padding: 10vh 20px 60px 20px;
            position: relative;
            z-index: 10;
        }

        .container {
            width: 100%;
            max-width: var(--container-width);
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInDown 0.8s ease forwards;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header h1 {
            font-family: var(--font-heading);
            font-size: clamp(2.5rem, 5vw, 4.5rem); /* Адаптивный размер */
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(to right, #ffffff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Search Section */
        .search-container {
            width: 100%;
            max-width: 700px;
            position: relative;
            z-index: 20;
        }

        .search-input {
            width: 100%;
            padding: 20px 30px 20px 60px;
            font-family: var(--font-body);
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--color-white);
            background: var(--glass-bg-heavy);
            border: 2px solid var(--border-medium);
            border-radius: var(--border-radius-lg);
            outline: none;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            transition: all var(--trans-normal);
            box-shadow: var(--shadow-md);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--color-accent);
            box-shadow: var(--shadow-lg), 0 0 20px rgba(0, 212, 255, 0.2);
            transform: translateY(-2px);
        }

        .search-icon {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            stroke: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            transition: stroke var(--trans-fast);
        }

        .search-input:focus ~ .search-icon {
            stroke: var(--color-accent);
        }

        /* Search Stats */
        .search-stats {
            margin-top: 15px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            height: 20px;
            opacity: 0;
            transition: opacity var(--trans-fast);
        }

        .search-stats.visible {
            opacity: 1;
        }

        /* ==========================================================================
           6. PRODUCT GRID & CARDS
           ========================================================================== */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            margin-top: 40px;
            perspective: 1000px; /* Для 3D эффекта карточек */
        }

        .card-wrapper {
            /* Обертка для 3D трансформаций */
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--glass-bg-medium);
            border: 1px solid var(--border-medium);
            border-radius: var(--border-radius-md);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: var(--shadow-md);
            transition: border var(--trans-fast), background var(--trans-fast), box-shadow var(--trans-fast);
            cursor: pointer;
            height: 100%;
            position: relative;
            overflow: hidden;
            /* Внутренняя тень для объема */
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), var(--shadow-md);
        }

        /* Эффект блика на карточке */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-20deg);
            transition: left 0.7s ease;
            z-index: 1;
        }

        .card-wrapper:hover .card {
            border-color: var(--border-accent);
            background: var(--glass-bg-heavy);
            box-shadow: var(--shadow-accent);
        }

        .card-wrapper:hover .card::before {
            left: 200%;
        }

        /* Card Content Layering for 3D */
        .card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 2;
            transform: translateZ(30px); /* Выдвигаем контент вперед */
        }

        .card-icons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            height: 130px;
            justify-content: center;
        }

        .icon-svg {
            width: 55px;
            height: 55px;
            stroke: var(--color-white);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            transition: transform var(--trans-normal);
        }

        .card-wrapper:hover .icon-svg {
            transform: scale(1.1);
            stroke: var(--color-accent);
        }

        .badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card-title {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
            line-height: 1.3;
        }

        .card-desc {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            margin-bottom: 20px;
            flex-grow: 1;
            line-height: 1.5;
        }

        .price-container {
            display: flex;
            align-items: baseline;
            gap: 5px;
            margin-bottom: 25px;
        }

        .price-currency {
            font-size: 1.2rem;
            color: var(--color-accent);
            font-weight: 600;
        }

        .price {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--color-accent);
            text-shadow: 0 2px 15px rgba(0, 212, 255, 0.3);
        }

        .buy-btn {
            width: 100%;
            padding: 16px 0;
            background: var(--color-white);
            color: var(--color-black);
            border: none;
            border-radius: var(--border-radius-sm);
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--trans-normal);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .buy-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(0,0,0,0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }

        .buy-btn:active::after {
            width: 200px;
            height: 200px;
        }

        .card-wrapper:hover .buy-btn {
            background: var(--color-accent);
            color: var(--color-white);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
            transform: translateY(-2px);
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--glass-bg-light);
            border-radius: var(--border-radius-md);
            border: 1px dashed var(--border-medium);
            animation: fadeIn 0.5s ease;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .empty-icon {
            width: 60px;
            height: 60px;
            stroke: rgba(255,255,255,0.4);
            margin-bottom: 20px;
        }

        .empty-text {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.6);
        }

        /* ==========================================================================
           7. MEDIA QUERIES (RESPONSIVE)
           ========================================================================== */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.2rem;
            }
            .search-input {
                padding: 16px 20px 16px 50px;
                font-size: 1rem;
            }
            .search-icon {
                left: 20px;
                width: 18px;
                height: 18px;
            }
            .results-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 20px;
            }
            .card {
                padding: 30px 20px;
            }
        }
    </style>
</head>

        const productsDatabase = [

        ];

        /**
         * ЛОГИКА СВЕЧЕНИЯ КУРСОРА
         */
        class CursorGlow {
            constructor(element) {
                this.glow = element;
                this.mouseX = window.innerWidth / 2;
                this.mouseY = window.innerHeight / 2;
                this.currentX = window.innerWidth / 2;
                this.currentY = window.innerHeight / 2;
                
                this.initEvents();
                this.animate();
            }

            initEvents() {
                // Движение мыши
                window.addEventListener('mousemove', (e) => {
                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;
                });
                
                // Тачи на мобильных
                window.addEventListener('touchmove', (e) => {
                    this.mouseX = e.touches[0].clientX;
                    this.mouseY = e.touches[0].clientY;
                });

                // Нажатия (уменьшенный, аккуратный всплеск)
                const activate = () => this.glow.classList.add('active');
                const deactivate = () => this.glow.classList.remove('active');

                window.addEventListener('mousedown', activate);
                window.addEventListener('mouseup', deactivate);
                window.addEventListener('touchstart', activate);
                window.addEventListener('touchend', deactivate);
            }

            // Плавное следование через RequestAnimationFrame (Lerp)
            animate() {
                // Линейная интерполяция для плавности
                this.currentX += (this.mouseX - this.currentX) * 0.2;
                this.currentY += (this.mouseY - this.currentY) * 0.2;
                
                this.glow.style.left = `${this.currentX}px`;
                this.glow.style.top = `${this.currentY}px`;
                
                requestAnimationFrame(this.animate.bind(this));
            }
        }

        // Инициализация свечения
        new CursorGlow(DOM.glow);

        /**
         * 3D ЭФФЕКТ НАКЛОНА ДЛЯ КАРТОЧЕК (TILT)
         */
        function applyTiltEffect(cardElement) {
            const card = cardElement.querySelector('.card');
            
            cardElement.addEventListener('mousemove', (e) => {
                const rect = cardElement.getBoundingClientRect();
                const x = e.clientX - rect.left; // x position within the element.
                const y = e.clientY - rect.top;  // y position within the element.
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                // Вычисляем градус наклона (максимум 10 градусов)
                const rotateX = ((y - centerY) / centerY) * -10;
                const rotateY = ((x - centerX) / centerX) * 10;
                
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });
            
            // Сброс при уходе курсора
            cardElement.addEventListener('mouseleave', () => {
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
                card.style.transition = `transform 0.5s ease`;
                setTimeout(() => { card.style.transition = ''; }, 500);
            });
        }

        /**
         * ДВИЖОК ПОИСКА И РЕНДЕРИНГА
         */
        class Store {
            constructor(data) {
                this.data = data;
                this.renderedCards = []; // Храним ссылки на созданные DOM элементы
                
                // Изначально ничего не показываем (пока не введен текст)
                DOM.emptyState.style.display = 'none';
                
                this.initSearch();
            }

            initSearch() {
                DOM.searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase().trim();
                    this.handleSearch(query);
                });
            }

            handleSearch(query) {
                // Очищаем текущую сетку (оставляем только empty state)
                this.clearGrid();

                if (query.length === 0) {
                    DOM.searchStats.classList.remove('visible');
                    DOM.emptyState.style.display = 'none';
                    return;
                }

                // Фильтруем базу данных
                const results = this.data.filter(item => {
                    // Проверяем совпадение по keywords, title, id
                    const matchTitle = item.title.toLowerCase().includes(query);
                    const matchKeywords = item.keywords.some(kw => kw.includes(query) || query.includes(kw));
                    return matchTitle || matchKeywords;
                });

                // Обновляем статистику
                DOM.searchStats.textContent = `Found ${results.length} service${results.length !== 1 ? 's' : ''}`;
                DOM.searchStats.classList.add('visible');

                // Рендерим результаты
                if (results.length > 0) {
                    DOM.emptyState.style.display = 'none';
                    results.forEach((product, index) => this.renderCard(product, index));
                } else {
                    DOM.emptyState.style.display = 'block';
                }
            }

            clearGrid() {
                // Удаляем все карточки, оставляя emptyState
                const cards = DOM.resultsGrid.querySelectorAll('.card-wrapper');
                cards.forEach(card => card.remove());
            }

            renderCard(product, index) {
                // Создаем обертку
                const wrapper = document.createElement('div');
                wrapper.className = 'card-wrapper';
                // Небольшая задержка анимации для эффекта лесенки
                wrapper.style.animationDelay = `${index * 0.05}s`;

                // Собираем иконки
                const iconsHTML = product.icons.join('');

                // Внутренний HTML
                wrapper.innerHTML = `
                    <div class="card">
                        <div class="card-content">
                            <div class="card-icons">
                                ${iconsHTML}
                            </div>
                            <div class="badge">${product.badge}</div>
                            <h2 class="card-title">${product.title}</h2>
                            <p class="card-desc">${product.desc}</p>
                            <div class="price-container">
                                <span class="price-currency">$</span>
                                <span class="price">${product.price}</span>
                            </div>
                            <button class="buy-btn" onclick="alert('Initiating purchase for: ${product.title}')">Purchase</button>
                        </div>
                    </div>
                `;

                DOM.resultsGrid.appendChild(wrapper);
                
                // Инициализируем 3D наклон для новой карточки
                applyTiltEffect(wrapper);
            }
        }

        // Запуск магазина
        const premiumStore = new Store(productsDatabase);


        /**
         * BACKGROUND CANVAS ANIMATION (ЧАСТИЦЫ)
         * Создает премиальный 3D эффект полета в облаке данных
         */
        class ParticleNetwork {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.numberOfParticles = 80;
                
                // Для интерактивности с мышью
                this.mouse = { x: null, y: null, radius: 150 };

                this.init();
                this.animate();

                window.addEventListener('resize', () => this.resize());
                
                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = e.x;
                    this.mouse.y = e.y;
                });
                
                window.addEventListener('mouseout', () => {
                    this.mouse.x = null;
                    this.mouse.y = null;
                });
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.createParticles();
            }

            init() {
                this.resize();
            }

            createParticles() {
                this.particles = [];
                for (let i = 0; i < this.numberOfParticles; i++) {
                    const size = (Math.random() * 2) + 0.5; // от 0.5 до 2.5
                    const x = Math.random() * this.canvas.width;
                    const y = Math.random() * this.canvas.height;
                    const speedX = (Math.random() - 0.5) * 0.5;
                    const speedY = (Math.random() - 0.5) * 0.5;
                    const color = `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.1})`;
                    
                    this.particles.push({ x, y, size, speedX, speedY, color, baseSize: size });
                }
            }

            animate() {
                requestAnimationFrame(this.animate.bind(this));
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                for (let i = 0; i < this.particles.length; i++) {
                    let p = this.particles[i];

                    // Движение
                    p.x += p.speedX;
                    p.y += p.speedY;

                    // Отражение от краев
                    if (p.x > this.canvas.width || p.x < 0) p.speedX = -p.speedX;
                    if (p.y > this.canvas.height || p.y < 0) p.speedY = -p.speedY;

                    // Интерактивность с курсором
                    if (this.mouse.x != null) {
                        let dx = this.mouse.x - p.x;
                        let dy = this.mouse.y - p.y;
                        let distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < this.mouse.radius) {
                            // Легкое отталкивание
                            const forceDirectionX = dx / distance;
                            const forceDirectionY = dy / distance;
                            const force = (this.mouse.radius - distance) / this.mouse.radius;
                            
                            p.x -= forceDirectionX * force * 2;
                            p.y -= forceDirectionY * force * 2;
                            
                            // Слегка увеличиваем размер рядом с мышью
                            p.size = p.baseSize * 2;
                        } else {
                            p.size = p.baseSize;
                        }
                    } else {
                        p.size = p.baseSize;
                    }

                    // Отрисовка частицы
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = p.color;
                    this.ctx.fill();
                }
            }
        }

        // Запуск анимации фона
        new ParticleNetwork(DOM.canvas);

    </script>
