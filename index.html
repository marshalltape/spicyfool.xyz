<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFICATED — Ultra-Luxury Digital Architectural Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Plus+Jakarta+Sans:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:wght@200;300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #010000;
            --bg-surface: #080000;
            --bg-elevated: #100202;
            --border-subtle: rgba(255, 20, 20, 0.12);
            --border-active: rgba(255, 40, 40, 0.45);
            --text-primary: #ffffff;
            --text-secondary: #9c8484;
            --text-muted: #5e4f4f;
            --accent-primary: #ff1111;
            --font-display: 'Cinzel Decorative', serif;
            --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow: hidden;
            position: relative;
        }

        /* Procedural Cinematic Film Grain & Vignette */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 20;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 20%, rgba(1, 0, 0, 0.95) 100%);
            pointer-events: none;
            z-index: 15;
        }

        #fogCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Optically centered stage with precise optical right shift */
        .stage {
            position: relative;
            z-index: 25;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3.5rem;
            padding: 2rem;
            padding-left: calc(2rem + 1.8vw);
        }

        .brand-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            position: relative;
        }

        .brand-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 7.5vw, 6.8rem);
            font-weight: 700;
            letter-spacing: 0.32em;
            text-transform: lowercase;
            color: var(--text-primary);
            text-align: center;
            background: linear-gradient(180deg, #ffffff 15%, #d19e9e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 80px rgba(255, 0, 0, 0.45);
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInScale 1.4s var(--ease-out-expo) forwards;
            animation-delay: 0.2s;
            user-select: none;
            position: relative;
        }

        .brand-subtitle {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: var(--text-secondary);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInScale 1.4s var(--ease-out-expo) forwards;
            animation-delay: 0.35s;
            user-select: none;
        }

        .brand-title::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 20, 20, 0.8), transparent);
        }

        .magnetic-wrapper {
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInScale 1.4s var(--ease-out-expo) forwards;
            animation-delay: 0.5s;
        }

        .tg-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 96px;
            height: 96px;
            background: rgba(14, 2, 2, 0.75);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-subtle);
            border-radius: 50%;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: border-color 0.5s var(--ease-out-expo), background 0.5s var(--ease-out-expo), box-shadow 0.5s var(--ease-out-expo);
        }

        .tg-button::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 25, 25, 0.7), transparent 70%);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .tg-button:hover {
            border-color: var(--border-active);
            background: rgba(30, 3, 3, 0.95);
            box-shadow: 0 50px 100px rgba(255, 0, 0, 0.45), inset 0 1px 0 rgba(255, 80, 80, 0.5);
        }

        .tg-button:hover::before {
            opacity: 1;
        }

        .tg-icon {
            width: 40px;
            height: 40px;
            fill: var(--text-primary);
            transition: transform 0.5s var(--ease-out-expo), fill 0.3s ease, filter 0.3s ease;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.7));
        }

        .tg-button:hover .tg-icon {
            transform: scale(1.18);
            fill: #ff1a1a;
            filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.85));
        }

        @keyframes fadeInScale {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hud-telemetry {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            opacity: 0.6;
            z-index: 30;
            user-select: none;
            pointer-events: none;
        }

        .hud-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-primary);
            animation: pulseHud 2s infinite ease-in-out;
        }

        @keyframes pulseHud {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <canvas id="fogCanvas"></canvas>

    <main class="stage">
        <div class="brand-container">
            <h1 class="brand-title">soficated</h1>
            <span class="brand-subtitle">Encrypted Ecosystem</span>
        </div>
        
        <div class="magnetic-wrapper" id="magneticWrapper">
            <a href="https://t.me/soficateded" target="_blank" rel="noopener noreferrer" class="tg-button" aria-label="Telegram Channel">
                <svg class="tg-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.73-.53.36-1.01.54-1.44.53-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.25.38-.51 1.06-.78 4.16-1.81 6.94-3 8.34-3.58 3.97-1.66 4.79-1.95 5.33-1.96.12 0 .39.03.56.17.14.12.18.28.2.4-.02.07-.02.2-.04.33z"/>
                </svg>
            </a>
        </div>
    </main>

    <div class="hud-telemetry">
        <div class="hud-dot"></div>
        <span>System Active // Secure Link v4.8</span>
    </div>

    <script>
        'use strict';

        const EngineConfig = {
            canvasId: 'fogCanvas',
            baseColor: '#010000',
            fogPlumeCount: 65,
            ambientParticleCount: 180,
            magneticPullRadius: 200,
            springTension: 0.12
        };

        class VolumetricCrimsonEngine {
            constructor(config) {
                this.config = config;
                this.canvas = document.getElementById(config.canvasId);
                this.ctx = this.canvas.getContext('2d', { alpha: false });
                
                this.width = 0;
                this.height = 0;
                this.plumes = [];
                this.orbs = [];

                this.initializeViewport();
                this.bindEventListeners();
                this.constructEcosystem();
                this.initRenderPipeline();
            }

            initializeViewport() {
                this.width = this.canvas.width = window.innerWidth;
                this.height = this.canvas.height = window.innerHeight;
            }

            bindEventListeners() {
                window.addEventListener('resize', () => {
                    this.initializeViewport();
                });
            }

            constructEcosystem() {
                for (let i = 0; i < this.config.fogPlumeCount; i++) {
                    this.plumes.push(new VolumetricPlumeNode(this.width, this.height));
                }
                for (let i = 0; i < this.config.ambientParticleCount; i++) {
                    this.orbs.push(new DepthAmbientNode(this.width, this.height));
                }
            }

            initRenderPipeline() {
                const renderLoop = (timestamp) => {
                    this.renderFrame(timestamp);
                    requestAnimationFrame(renderLoop);
                };
                requestAnimationFrame(renderLoop);
            }

            renderFrame(timestamp) {
                this.ctx.fillStyle = this.config.baseColor;
                this.ctx.fillRect(0, 0, this.width, this.height);

                this.ctx.globalCompositeOperation = 'screen';

                for (let i = 0; i < this.plumes.length; i++) {
                    this.plumes[i].update(this.width, this.height, timestamp);
                    this.plumes[i].draw(this.ctx);
                }

                for (let i = 0; i < this.orbs.length; i++) {
                    this.orbs[i].update(this.width, this.height);
                    this.orbs[i].draw(this.ctx);
                }

                this.ctx.globalCompositeOperation = 'source-over';
            }
        }

        class VolumetricPlumeNode {
            constructor(w, h) {
                this.reset(w, h);
            }

            reset(w, h) {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() * Math.max(w, h) * 0.65 + 450;
                this.baseAlpha = Math.random() * 0.18 + 0.05;
                this.alpha = this.baseAlpha;
                this.vx = (Math.random() - 0.5) * 0.14;
                this.vy = (Math.random() - 0.5) * 0.14 - 0.07;
                this.phase = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 0.0022 + 0.0008;
            }

            update(w, h, timestamp) {
                this.phase += this.speed;
                this.x += this.vx + Math.sin(this.phase) * 0.25;
                this.y += this.vy + Math.cos(this.phase) * 0.25;
                this.alpha = this.baseAlpha + Math.sin(this.phase) * 0.045;

                if (this.x < -this.size) this.x = w + this.size;
                if (this.x > w + this.size) this.x = -this.size;
                if (this.y < -this.size) this.y = h + this.size;
                if (this.y > h + this.size) this.y = -this.size;
            }

            draw(ctx) {
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size
                );
                gradient.addColorStop(0, `rgba(250, 15, 15, ${Math.max(0, this.alpha)})`);
                gradient.addColorStop(0.32, `rgba(120, 2, 2, ${Math.max(0, this.alpha * 0.52)})`);
                gradient.addColorStop(1, 'rgba(1, 0, 0, 0)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class DepthAmbientNode {
            constructor(w, h) {
                this.reset(w, h);
            }

            reset(w, h) {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.radius = Math.random() * 2.8 + 0.7;
                this.baseAlpha = Math.random() * 0.5 + 0.12;
                this.alpha = this.baseAlpha;
                this.vy = -Math.random() * 0.25 - 0.08;
                this.vx = (Math.random() - 0.5) * 0.08;
                this.twinkleSpeed = Math.random() * 0.016 + 0.006;
                this.twinklePhase = Math.random() * Math.PI * 2;
            }

            update(w, h) {
                this.y += this.vy;
                this.x += this.vx;
                this.twinklePhase += this.twinkleSpeed;
                this.alpha = this.baseAlpha + Math.sin(this.twinklePhase) * 0.2;

                if (this.y < -20) this.y = h + 20;
                if (this.x < 0) this.x = w;
                if (this.x > w) this.x = 0;
            }

            draw(ctx) {
                ctx.fillStyle = `rgba(255, 120, 120, ${Math.max(0, this.alpha)})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class AppleGradeMagneticEngine {
            constructor() {
                this.wrapper = document.getElementById('magneticWrapper');
                this.button = this.wrapper.querySelector('.tg-button');
                
                this.mouseX = window.innerWidth / 2;
                this.mouseY = window.innerHeight / 2;
                this.currentX = 0;
                this.currentY = 0;
                this.targetX = 0;
                this.targetY = 0;

                this.bindTrackingListeners();
                this.initSpringDynamics();
            }

            bindTrackingListeners() {
                window.addEventListener('mousemove', (e) => {
                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;

                    const rect = this.button.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    const distX = this.mouseX - centerX;
                    const distY = this.mouseY - centerY;
                    const distance = Math.hypot(distX, distY);

                    if (distance < EngineConfig.magneticPullRadius) {
                        this.targetX = distX * 0.55;
                        this.targetY = distY * 0.55;
                    } else {
                        this.targetX = 0;
                        this.targetY = 0;
                    }
                });

                window.addEventListener('mouseleave', () => {
                    this.targetX = 0;
                    this.targetY = 0;
                });
            }

            initSpringDynamics() {
                const springLoop = () => {
                    this.currentX += (this.targetX - this.currentX) * EngineConfig.springTension;
                    this.currentY += (this.targetY - this.currentY) * EngineConfig.springTension;

                    this.wrapper.style.transform = `translate(${this.currentX}px, ${this.currentY}px)`;
                    this.button.style.transform = `translate(${this.currentX * 0.42}px, ${this.currentY * 0.42}px)`;

                    requestAnimationFrame(springLoop);
                };
                requestAnimationFrame(springLoop);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new VolumetricCrimsonEngine(EngineConfig);
            new AppleGradeMagneticEngine();
        });
    </script>
</body>
</html>
