<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Digital Store</title>
    <style>
        /* === RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Яркий переливающийся градиент */
            background: linear-gradient(-45deg, #ff0040, #1900ff, #b700ff, #00d4ff);
            background-size: 300% 300%;
            animation: gradientCloud 5s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15vh; /* Отступ сверху, чтобы поиск был по центру изначально */
        }

        @keyframes gradientCloud {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* === CURSOR GLOW === */
        #glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 400px; 
            height: 400px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.15) 40%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            pointer-events: none; /* Важно: чтобы не блокировал клики */
            transform: translate(-50%, -50%);
            z-index: 9999;
            mix-blend-mode: screen; /* Screen делает свечение намного ярче на цветном фоне */
            transition: transform 0.1s ease-out, width 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), height 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s;
        }

        /* Класс, который добавляется при клике/нажатии */
        #glow.active {
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.4) 30%, rgba(255, 255, 255, 0) 70%);
        }

        /* === LAYOUT === */
        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: 1.5px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        /* === SEARCH === */
        .search-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 22px 30px;
            font-size: 1.2rem;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            outline: none;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.2);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.8);
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid #00d4ff;
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.5);
        }

        /* === RESULTS GRID === */
        .results-grid {
            display: none; /* Скрыто по умолчанию */
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 60px;
            animation: fadeInUP 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes fadeInUP {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === PRODUCT CARDS === */
        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, border 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border: 1px solid #00d4ff;
            background: rgba(255, 255, 255, 0.12);
        }

        .card-icons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .icon-svg {
            width: 60px;
            height: 60px;
            stroke: #fff;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .card-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
        }

        .price {
            font-size: 2.5rem;
            font-weight: 800;
            color: #00d4ff;
            margin: 15px 0 25px 0;
            text-shadow: 0 2px 10px rgba(0, 212, 255, 0.4);
        }

        .buy-btn {
            padding: 15px 40px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .card:hover .buy-btn {
            background: #00d4ff;
            color: #fff;
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.5);
        }

    </style>
</head>
<body>

    <!-- Улучшенный элемент свечения -->
    <div id="glow"></div>

    <div class="container">
        <header class="header">
            <h1>Premium Digital Accounts</h1>
            <div class="search-container">
                <!-- Подсказка в placeholder -->
                <input type="text" id="searchInput" class="search-input" placeholder="Type 'Telegram' to search...">
            </div>
        </header>

        <!-- Сетка товаров (изначально скрыта) -->
        <main id="resultsGrid" class="results-grid">
            
            <!-- Карточка 1: США -->
            <div class="card">
                <div class="card-icons">
                    <!-- Иконка Telegram (чистый SVG) -->
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                    </svg>
                    <!-- Иконка SIM-карты (чистый SVG) -->
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Контур симки со срезанным углом -->
                        <path d="M7 2 h10 a2 2 0 0 1 2 2 v16 a2 2 0 0 1 -2 2 h-12 a2 2 0 0 1 -2 -2 v-12 l4 -4 z"></path>
                        <!-- Контакты чипа -->
                        <rect x="9" y="10" width="6" height="8" rx="1"></rect>
                        <line x1="9" y1="14" x2="15" y2="14"></line>
                        <line x1="12" y1="10" x2="12" y2="18"></line>
                    </svg>
                </div>
                <h2 class="card-title">Telegram Account USA</h2>
                <div class="price">$7</div>
                <button class="buy-btn">Purchase</button>
            </div>

            <!-- Карточка 2: РУ -->
            <div class="card">
                <div class="card-icons">
                    <!-- Иконка Telegram -->
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                    </svg>
                    <!-- Иконка SIM-карты -->
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 2 h10 a2 2 0 0 1 2 2 v16 a2 2 0 0 1 -2 2 h-12 a2 2 0 0 1 -2 -2 v-12 l4 -4 z"></path>
                        <rect x="9" y="10" width="6" height="8" rx="1"></rect>
                        <line x1="9" y1="14" x2="15" y2="14"></line>
                        <line x1="12" y1="10" x2="12" y2="18"></line>
                    </svg>
                </div>
                <h2 class="card-title">Telegram Account RU</h2>
                <div class="price">$8</div>
                <button class="buy-btn">Purchase</button>
            </div>

        </main>
    </div>

    <script>
        // === ЛОГИКА СВЕЧЕНИЯ ===
        const glow = document.getElementById('glow');

        // Следование за курсором (с requestAnimationFrame для максимальной плавности)
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            // Убираем задержку через прямой стиль
            glow.style.left = mouseX + 'px';
            glow.style.top = mouseY + 'px';
        });

        window.addEventListener('touchmove', (e) => {
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
            glow.style.left = mouseX + 'px';
            glow.style.top = mouseY + 'px';
        });

        // Резкое и заметное увеличение при нажатии
        const activateGlow = () => glow.classList.add('active');
        const deactivateGlow = () => glow.classList.remove('active');

        window.addEventListener('mousedown', activateGlow);
        window.addEventListener('mouseup', deactivateGlow);
        window.addEventListener('touchstart', activateGlow);
        window.addEventListener('touchend', deactivateGlow);


        // === ЛОГИКА ПОИСКА ===
        const searchInput = document.getElementById('searchInput');
        const resultsGrid = document.getElementById('resultsGrid');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            
            // Если ввели 'telegram' или 'телеграм', показываем карточки
            if (query.includes('telegram') || query.includes('телеграм')) {
                resultsGrid.style.display = 'grid';
            } else {
                resultsGrid.style.display = 'none';
            }
        });
    </script>
</body>
</html>
