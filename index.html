    <meta charset="UTF-8">

    <title>Premium Digital Store | Swiss Dynamic</title>
    
    <!-- Подключение шрифта Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        /* ==========================================================================
           1. CSS VARIABLES & DESIGN TOKENS
           ========================================================================== */
        :root {
            --font-main: 'Inter', sans-serif;
            
            --bg-card: #0a0a0a; 
            --color-text-main: #ffffff;
            --color-text-muted: #888888;
            --color-divider: #222222;
            --color-badge-blue: #3221ff; 
            --color-badge-red: #ff1e56;
            --color-badge-cyan: #00d4ff;
            --color-badge-purple: #8e2de2;
            
            --shadow-card: 0 30px 60px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 40px 80px rgba(0, 0, 0, 0.6);
            --container-width: 1000px;
        }

        /* ==========================================================================
           2. RESET & NORMALIZE
           ========================================================================== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            /* Базовый фон на случай проблем с рендером */
            background-color: #050510;
        }

        body {
            font-family: var(--font-main);
            color: var(--color-text-main);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* ВАЖНО: Возвращаем дефолтный курсор, чтобы его всегда было видно */
            cursor: default; 
            position: relative;
            background-color: transparent;
        }

        ::selection {
            background: var(--color-badge-blue);
            color: #ffffff;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #555555; }

        /* ==========================================================================
           3. BACKGROUND (FAST PURPLE/BLUE CLOUD)
           ========================================================================== */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            /* Более контрастные и насыщенные сине-фиолетовые цвета */
            background: linear-gradient(270deg, #10002b, #3c096c, #5a189a, #7b2cbf, #1900ff, #00d4ff);
            background-size: 800% 800%;
            /* Ускоренная анимация переливания (4 секунды) */
            animation: cloudMorph 4s ease-in-out infinite alternate;
            z-index: 1; /* Положительный z-index гарантирует видимость */
            pointer-events: none;
        }

        @keyframes cloudMorph {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #particleCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 2; /* Частицы поверх градиента */
            pointer-events: none;
            opacity: 0.6;
        }

        /* ==========================================================================
           4. CURSOR GLOW (СИЯНИЕ КУРСОРА)
           ========================================================================== */
        #glow {
            position: fixed;
            top: 0; left: 0;
            width: 400px; height: 400px;
            /* Яркий белый градиент для сияния */
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.15) 30%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            /* Screen гарантирует осветление фона, сияние не пропадет на черном */
            mix-blend-mode: screen; 
            transition: width 0.15s ease-out, height 0.15s ease-out, background 0.15s ease-out;
            will-change: transform, width, height;
        }

        #glow.active {
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0.3) 40%, rgba(255,255,255,0) 80%);
        }

        #cursor-dot {
            position: fixed;
            top: 0; left: 0;
            width: 8px; height: 8px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 10000;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        /* ==========================================================================
           5. LAYOUT COMPONENTS (HEADER & SEARCH)
           ========================================================================== */
        .page-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 8vh 20px 80px 20px;
            position: relative;
            z-index: 10; /* Контент поверх всех фонов */
        }

        .container {
            width: 100%;
            max-width: var(--container-width);
            margin: 0 auto;
        }

        .header {
            width: 100%;
            margin-bottom: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInDown 0.8s ease forwards;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 30px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 22px 20px 22px 60px;
            font-family: var(--font-main);
            font-size: 1.2rem;
            font-weight: 500;
            color: #ffffff;
            background: rgba(10, 10, 10, 0.7);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            outline: none;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            transition: all 0.3s ease;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .search-input::placeholder { color: rgba(255,255,255,0.6); font-weight: 400; }
        .search-input:focus {
            border-color: #ffffff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            background: rgba(10, 10, 10, 0.9);
        }

        .search-icon {
            position: absolute;
            left: 25px; top: 50%;
            transform: translateY(-50%);
            width: 22px; height: 22px;
            stroke: rgba(255,255,255,0.7);
            pointer-events: none;
            transition: stroke 0.3s ease;
            stroke-width: 2;
        }

        .search-input:focus ~ .search-icon { stroke: #ffffff; }

        .search-stats {
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .search-stats.visible { opacity: 1; }

        /* ==========================================================================
           6. SWISS DESIGN CARDS
           ========================================================================== */
        .results-grid {
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 100%;
            perspective: 2000px; 
        }

        .card-wrapper {
            transform-style: preserve-3d;
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
            cursor: pointer;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background-color: var(--bg-card);
            width: 100%;
            border-radius: 32px;
            padding: 60px;
            color: var(--color-text-main);
            box-shadow: var(--shadow-card);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1); 
        }

        .card-wrapper:hover .card {
            box-shadow: var(--shadow-hover);
            border-color: rgba(255,255,255,0.3);
        }

        .card-header {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            padding: 20px 0 40px 0;
        }

        .title-wrapper {
            position: relative;
            display: inline-block;
        }

        .title {
            font-size: clamp(60px, 12vw, 150px);
            font-weight: 700;
            letter-spacing: -0.06em;
            line-height: 0.85;
            margin: 0;
            text-transform: capitalize;
            color: #ffffff;
        }

        .badge {
            position: absolute;
            top: -10px;
            right: -35px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .card-wrapper:hover .badge { transform: scale(1.1) rotate(5deg); }

        .divider {
            height: 1px;
            background-color: var(--color-divider);
            width: 100%;
            margin: 0;
        }

        .specs {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .spec-item {
            font-size: 11px;
            color: var(--color-text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 30px;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .circle-num {
            background-color: #ffffff;
            color: #000000;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .card-wrapper:hover .circle-num {
            background-color: var(--color-badge-blue);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(50, 33, 255, 0.4);
        }

        .footer-text {
            font-weight: 600;
            font-size: 15px;
            color: #ffffff;
        }

        .footer-right { text-align: right; }

        .brand {
            display: block;
            font-weight: 700;
            font-size: 15px;
            color: #ffffff;
        }

        .sub-brand {
            display: block;
            font-size: 9px;
            color: #666666;
            margin-top: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: rgba(10,10,10,0.8);
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 32px;
            display: none;
            backdrop-filter: blur(10px);
        }

        .empty-state h2 { font-size: 2rem; margin-bottom: 10px; }
        .empty-state p { color: #888; }

        @media (max-width: 768px) {
            .card { padding: 40px 25px; }
            .title { font-size: 18vw; }
            .badge { width: 40px; height: 40px; font-size: 9px; right: -10px; top: -5px; }
            .specs { flex-direction: column; align-items: flex-start; gap: 12px; }
            .footer-text { display: none; }
        }

        /**
         * ЛОГИКА СВЕЧЕНИЯ КУРСОРА (GLOW ENGINE)
         * Теперь всегда работает безотказно. 
         * На черном фоне белое пятно высветляет цвета через Screen.
         */
        class CursorGlow {
            constructor(glowElement, dotElement) {
                this.glow = glowElement;
                this.dot = dotElement;
                
                this.mouseX = window.innerWidth / 2;
                this.mouseY = window.innerHeight / 2;
                
                this.currentX = window.innerWidth / 2;
                this.currentY = window.innerHeight / 2;
                
                this.initEvents();
                this.animate();
            }

            initEvents() {
                window.addEventListener('mousemove', (e) => {
                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;
                });
                
                window.addEventListener('touchmove', (e) => {
                    this.mouseX = e.touches[0].clientX;
                    this.mouseY = e.touches[0].clientY;
                });

                const activate = () => this.glow.classList.add('active');
                const deactivate = () => this.glow.classList.remove('active');

                window.addEventListener('mousedown', activate);
                window.addEventListener('mouseup', deactivate);
                window.addEventListener('touchstart', activate);
                window.addEventListener('touchend', deactivate);
            }

            animate() {
                this.currentX += (this.mouseX - this.currentX) * 0.15;
                this.currentY += (this.mouseY - this.currentY) * 0.15;
                
                this.glow.style.left = `${this.currentX}px`;
                this.glow.style.top = `${this.currentY}px`;
                
                if(this.dot) {
                    this.dot.style.left = `${this.mouseX}px`;
                    this.dot.style.top = `${this.mouseY}px`;
                }
                
                requestAnimationFrame(this.animate.bind(this));
            }
        }

        const DOM = {
            glow: document.getElementById('glow'),

            resultsGrid: document.getElementById('resultsGrid'),
            searchStats: document.getElementById('searchStats'),
            emptyState: document.getElementById('emptyState'),
            canvas: document.getElementById('particleCanvas')
        };
        
        new CursorGlow(DOM.glow, DOM.dot);

        /**
         * 3D ЭФФЕКТ НАКЛОНА КАРТОЧЕК (TILT)
         */
        function applyTiltEffect(cardElement) {
            const card = cardElement.querySelector('.card');
            
            cardElement.addEventListener('mousemove', (e) => {
                const rect = cardElement.getBoundingClientRect();
                const x = e.clientX - rect.left; 
                const y = e.clientY - rect.top;  
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -5;
                const rotateY = ((x - centerX) / centerX) * 5;
                
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
            });
            
            cardElement.addEventListener('mouseleave', () => {
                card.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            });
        }

        /**
         * ДВИЖОК ПОИСКА И РЕНДЕРИНГА
         */
        class StoreEngine {
            constructor(data) {
                this.data = data;
                this.renderAll();
                this.initSearch();
            }

            renderAll() {
                this.clearGrid();
                // Показываем первые 30 для оптимизации
                this.data.slice(0, 30).forEach((product, index) => this.renderCard(product, index));
                DOM.searchStats.textContent = `Displaying ${Math.min(this.data.length, 30)} items`;
                DOM.searchStats.classList.add('visible');
            }

            initSearch() {
                DOM.searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase().trim();
                    this.handleSearch(query);
                });
            }

            handleSearch(query) {
                this.clearGrid();

                if (query.length === 0) {
                    this.renderAll();
                    return;
                }

                const results = this.data.filter(item => {
                    const matchTitle = item.hugeTitle.toLowerCase().includes(query) || item.badgeText.toLowerCase().includes(query);
                    const matchKeywords = item.keywords.some(kw => kw.includes(query) || query.includes(kw));
                    return matchTitle || matchKeywords;
                });

                DOM.searchStats.textContent = `Found ${results.length} result${results.length !== 1 ? 's' : ''}`;
                DOM.searchStats.classList.add('visible');

                if (results.length > 0) {
                    DOM.emptyState.style.display = 'none';
                    results.forEach((product, index) => this.renderCard(product, index));
                } else {
                    DOM.emptyState.style.display = 'block';
                }
            }

            clearGrid() {
                const cards = DOM.resultsGrid.querySelectorAll('.card-wrapper');
                cards.forEach(card => card.remove());
            }

            renderCard(product, index) {
                const wrapper = document.createElement('div');
                wrapper.className = 'card-wrapper';
                wrapper.style.animationDelay = `${index * 0.05}s`;
                
                wrapper.addEventListener('click', () => {
                    alert(`Initiating secure checkout for: ${product.hugeTitle} ${product.badgeText}`);
                });

                const specsHtml = product.specs.map(spec => `<span class="spec-item">${spec}</span>`).join('');

                wrapper.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <div class="title-wrapper">
                                <h2 class="title">${product.hugeTitle}</h2>
                                <div class="badge" style="background-color: ${product.badgeColor};">${product.badgeText}</div>
                            </div>
                        </div>
                        
                        <div class="divider"></div>
                        
                        <div class="specs">
                            ${specsHtml}
                        </div>
                        
                        <div class="divider"></div>
                        
                        <div class="card-footer">
                            <div class="footer-left">
                                <div class="circle-num">$${product.price}</div>
                                <span class="footer-text">${product.actionText}</span>
                            </div>
                            <div class="footer-right">
                                <span class="brand">${product.brand}</span>
                                <span class="sub-brand">${product.subBrand}</span>
                            </div>
                        </div>
                    </div>
                `;

                DOM.resultsGrid.appendChild(wrapper);
                
                if (window.matchMedia("(pointer: fine)").matches) {
                    applyTiltEffect(wrapper);
                }
            }
        }

        /**
         * АНИМАЦИЯ ЧАСТИЦ (ЗВЕЗДНАЯ ПЫЛЬ)
         */
        class ParticleEngine {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.particleCount = 100; 

                this.init();
                this.animate();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.createParticles();
            }

            init() {
                this.resize();
            }

            createParticles() {
                this.particles = [];
                for (let i = 0; i < this.particleCount; i++) {
                    const size = Math.random() * 2 + 0.5; 
                    const x = Math.random() * this.canvas.width;
                    const y = Math.random() * this.canvas.height;
                    const speedX = (Math.random() - 0.5) * 0.5;
                    const speedY = (Math.random() - 0.5) * 0.5;
                    const opacity = Math.random() * 0.5 + 0.1;
                    const color = `rgba(255, 255, 255, ${opacity})`; 
                    
                    this.particles.push({ x, y, size, speedX, speedY, color });
                }
            }

            animate() {
                requestAnimationFrame(this.animate.bind(this));
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                for (let i = 0; i < this.particles.length; i++) {
                    let p = this.particles[i];

                    p.x += p.speedX;
                    p.y += p.speedY;

                    if (p.x > this.canvas.width || p.x < 0) p.speedX = -p.speedX;
                    if (p.y > this.canvas.height || p.y < 0) p.speedY = -p.speedY;

                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = p.color;
                    this.ctx.fill();
                }
            }
        }

        new ParticleEngine(DOM.canvas);
