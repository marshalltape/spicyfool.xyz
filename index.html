<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFICATED</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030000;
            --surface: #0a0303;
            --border: rgba(255, 30, 30, 0.12);
            --border-hover: rgba(255, 50, 50, 0.4);
            --text-primary: #f5f5f7;
            --text-secondary: #8c8282;
            --accent: #ff1a1a;
            --accent-glow: rgba(255, 0, 0, 0.2);
            --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* High-End Procedural Noise Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.025'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 10;
        }

        /* Cinematic WebGL Canvas Layer */
        #fogCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Center Stage Layout */
        .stage {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.75rem;
            padding: 2rem;
        }

        /* Luxury Typography */
        .brand-title {
            font-size: clamp(3rem, 7vw, 6.5rem);
            font-weight: 200;
            letter-spacing: 0.35em;
            text-transform: lowercase;
            color: var(--text-primary);
            text-align: center;
            text-shadow: 0 0 50px rgba(255, 0, 0, 0.3);
            opacity: 0;
            transform: translateY(24px);
            animation: fadeInScale 1.4s var(--ease-out-expo) forwards;
            animation-delay: 0.2s;
            user-select: none;
        }

        /* Interactive Magnetic Wrapper */
        .magnetic-wrapper {
            position: relative;
            opacity: 0;
            transform: translateY(24px);
            animation: fadeInScale 1.4s var(--ease-out-expo) forwards;
            animation-delay: 0.4s;
        }

        /* Premium Apple-Grade Telegram Button */
        .tg-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 84px;
            height: 84px;
            background: rgba(12, 2, 2, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 50%;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: border-color 0.5s var(--ease-out-expo), background 0.5s var(--ease-out-expo), box-shadow 0.5s var(--ease-out-expo);
        }

        .tg-button::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 40, 40, 0.5), transparent 70%);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .tg-button:hover {
            border-color: var(--border-hover);
            background: rgba(25, 4, 4, 0.85);
            box-shadow: 0 35px 70px rgba(255, 0, 0, 0.3), inset 0 1px 0 rgba(255, 60, 60, 0.3);
        }

        .tg-button:hover::before {
            opacity: 1;
        }

        .tg-icon {
            width: 34px;
            height: 34px;
            fill: var(--text-primary);
            transition: transform 0.5s var(--ease-out-expo), fill 0.3s ease, filter 0.3s ease;
        }

        .tg-button:hover .tg-icon {
            transform: scale(1.12);
            fill: #ff2a2a;
            filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.6));
        }

        @keyframes fadeInScale {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Cinematic Custom Canvas Fog -->
    <canvas id="fogCanvas"></canvas>

    <!-- Main Content Area -->
    <main class="stage">
        <h1 class="brand-title">soficated</h1>
        
        <div class="magnetic-wrapper" id="magneticWrapper">
            <a href="https://t.me/soficateded" target="_blank" rel="noopener noreferrer" class="tg-button" aria-label="Telegram Channel">
                <svg class="tg-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.73-.53.36-1.01.54-1.44.53-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.25.38-.51 1.06-.78 4.16-1.81 6.94-3 8.34-3.58 3.97-1.66 4.79-1.95 5.33-1.96.12 0 .39.03.56.17.14.12.18.28.2.4-.02.07-.02.2-.04.33z"/>
                </svg>
            </a>
        </div>
    </main>

    <script>
        // High-end volumetric crimson fog and particle orchestration engine
        const canvas = document.getElementById('fogCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let ambientOrbs = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        // Architectural Volumetric Fog Plume Class
        class FogPlume {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * Math.max(width, height) * 0.45 + 250;
                this.baseAlpha = Math.random() * 0.12 + 0.04;
                this.alpha = this.baseAlpha;
                this.vx = (Math.random() - 0.5) * 0.15;
                this.vy = (Math.random() - 0.5) * 0.15 - 0.08;
                this.phase = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 0.003 + 0.001;
            }

            update(timestamp) {
                this.phase += this.speed;
                this.x += this.vx + Math.sin(this.phase) * 0.25;
                this.y += this.vy + Math.cos(this.phase) * 0.25;
                this.alpha = this.baseAlpha + Math.sin(this.phase) * 0.035;

                if (this.x < -this.size) this.x = width + this.size;
                if (this.x > width + this.size) this.x = -this.size;
                if (this.y < -this.size) this.y = height + this.size;
                if (this.y > height + this.size) this.y = -this.size;
            }

            draw() {
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size
                );
                gradient.addColorStop(0, `rgba(190, 10, 10, ${Math.max(0, this.alpha)})`);
                gradient.addColorStop(0.45, `rgba(80, 2, 2, ${Math.max(0, this.alpha * 0.45)})`);
                gradient.addColorStop(1, 'rgba(3, 0, 0, 0)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Ambient Depth Light Orbs
        class AmbientOrb {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 2 + 0.5;
                this.baseAlpha = Math.random() * 0.3 + 0.1;
                this.alpha = this.baseAlpha;
                this.vy = -Math.random() * 0.3 - 0.1;
                this.vx = (Math.random() - 0.5) * 0.1;
                this.twinkleSpeed = Math.random() * 0.02 + 0.01;
                this.twinklePhase = Math.random() * Math.PI * 2;
            }

            update() {
                this.y += this.vy;
                this.x += this.vx;
                this.twinklePhase += this.twinkleSpeed;
                this.alpha = this.baseAlpha + Math.sin(this.twinklePhase) * 0.15;

                if (this.y < -10) this.y = height + 10;
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 80, 80, ${Math.max(0, this.alpha)})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Dense Systems
        for (let i = 0; i < 18; i++) {
            particles.push(new FogPlume());
        }

        for (let i = 0; i < 45; i++) {
            ambientOrbs.push(new AmbientOrb());
        }

        let lastTime = 0;
        function renderLoop(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            ctx.fillStyle = '#030000';
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'screen';

            particles.forEach(p => {
                p.update(timestamp);
                p.draw();
            });

            ambientOrbs.forEach(orb => {
                orb.update();
                orb.draw();
            });

            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(renderLoop);
        }

        requestAnimationFrame(renderLoop);

        // Apple-Grade Micro-Interaction Physics Engine for Magnetic Button
        const wrapper = document.getElementById('magneticWrapper');
        const button = wrapper.querySelector('.tg-button');

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let currentX = 0;
        let currentY = 0;
        let targetX = 0;
        let targetY = 0;

        const maxPullDistance = 140;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            const rect = button.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const distX = mouseX - centerX;
            const distY = mouseY - centerY;
            const distance = Math.hypot(distX, distY);

            if (distance < maxPullDistance) {
                targetX = distX * 0.42;
                targetY = distY * 0.42;
            } else {
                targetX = 0;
                targetY = 0;
            }
        });

        window.addEventListener('mouseleave', () => {
            targetX = 0;
            targetY = 0;
        });

        function updatePhysics() {
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;

            wrapper.style.transform = `translate(${currentX}px, ${currentY}px)`;
            button.style.transform = `translate(${currentX * 0.45}px, ${currentY * 0.45}px)`;

            requestAnimationFrame(updatePhysics);
        }

        requestAnimationFrame(updatePhysics);
    </script>
</body>
</html>
